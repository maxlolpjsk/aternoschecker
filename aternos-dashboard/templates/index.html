<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #11111b; color: #cdd6f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e1e2e; border: 1px solid #313244; border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #cdd6f4; }
        p { font-size: 0.9rem; color: #a6adc8; margin-bottom: 20px; }
        .ip-box { background: #181825; border: 1px solid #313244; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .ip-text { font-family: monospace; font-size: 1rem; color: #89b4fa; word-break: break-all; margin-bottom: 12px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-copy { background: #a6e3a1; color: #11111b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Minecraft Server</h1>
        <p>Tap below to copy the server address and join your friends!</p>

        <div class="ip-box">
            <div id="serverIp" class="ip-text">MaxMax123321MM.aternos.me:13753</div>
            <button class="btn btn-copy" onclick="copyIp()">📋 Copy Server IP</button>
        </div>
    </div>

    <script>
        function copyIp() {
            const ipText = "MaxMax123321MM.aternos.me:13753";
            navigator.clipboard.writeText(ipText).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerText = "Copied to Clipboard!";
                setTimeout(() => {
                    btn.innerText = "📋 Copy Server IP";
                }, 2000);
            });
        }
    </script>
</body>
</html>
